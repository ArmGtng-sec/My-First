<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1eb">
  <title>Ruang Chat</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f5f3;
      --surface: #ffffff;
      --surface-2: #eeeee9;
      --ink: #1d1e1b;
      --muted: #73746e;
      --line: #deded8;
      --accent: #b94731;
      --accent-soft: #f5ddd7;
      --user: #242522;
      --danger: #a72d23;
      --code: #f0f0eb;
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --paper: #171816; --surface: #22231f; --surface-2: #2a2b27; --ink: #eeeeda; --muted: #a5a69d; --line: #393a35; --accent: #e26b51; --accent-soft: #43251f; --user: #e8e9df; --code: #171816; }
      .user .bubble { color: #191a17; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); font: 15px/1.55 Arial, Helvetica, sans-serif; }
    button, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100svh; display: flex; flex-direction: column; max-width: 760px; margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) 18px 14px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 92%, transparent); position: sticky; top: 0; z-index: 2; backdrop-filter: blur(12px); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: white; font-weight: 700; }
    h1 { font-size: 17px; line-height: 1.1; margin: 0; letter-spacing: 0; }
    .status { color: var(--muted); font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .clear { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 10px; min-width: 44px; height: 40px; font-size: 18px; transition: .18s ease; }
    .clear:hover, .clear:focus-visible { color: var(--ink); border-color: var(--ink); outline: none; }
    main { flex: 1; display: flex; flex-direction: column; padding: 22px 14px max(16px, env(safe-area-inset-bottom)); }
    #messages { flex: 1; display: flex; flex-direction: column; gap: 20px; padding-bottom: 18px; }
    .welcome { margin: auto 10px; max-width: 460px; }
    .welcome .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .12em; font-size: 11px; font-weight: 700; }
    .welcome h2 { font: 400 31px/1.08 Georgia, 'Times New Roman', serif; margin: 8px 0 10px; }
    .welcome p { margin: 0; color: var(--muted); }
    .message { display: flex; flex-direction: column; max-width: 92%; gap: 5px; animation: appear .2s ease both; }
    .message.user { align-self: flex-end; align-items: flex-end; max-width: 84%; }
    .message.assistant { align-self: flex-start; width: 100%; }
    .bubble { padding: 12px 14px; border-radius: var(--radius); overflow-wrap: anywhere; }
    .user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 5px; white-space: pre-wrap; }
    .assistant .bubble { background: transparent; border: 0; padding: 0 4px; border-bottom-left-radius: 5px; }
    .assistant .bubble p { margin: 0 0 12px; }.assistant .bubble p:last-child { margin-bottom: 0; }
    .assistant .bubble h1, .assistant .bubble h2, .assistant .bubble h3 { font-family: Georgia, 'Times New Roman', serif; line-height: 1.2; margin: 16px 0 8px; }
    .assistant .bubble h1 { font-size: 24px; }.assistant .bubble h2 { font-size: 20px; }.assistant .bubble h3 { font-size: 17px; }
    .assistant .bubble ul, .assistant .bubble ol { margin: 6px 0 14px; padding-left: 23px; }.assistant .bubble li { margin: 4px 0; }
    .assistant .bubble blockquote { margin: 10px 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
    .assistant .bubble code { background: var(--surface-2); border-radius: 5px; padding: 2px 5px; font: 13px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .assistant .bubble pre { position: relative; margin: 12px 0; padding: 14px; overflow: auto; background: var(--code); border: 1px solid var(--line); border-radius: 10px; }
    .assistant .bubble pre code { padding: 0; background: transparent; white-space: pre; }
    .assistant .bubble a { color: var(--accent); }.meta { color: var(--muted); font-size: 10px; padding: 0 5px; }
    .assistant-actions { display: flex; gap: 5px; margin-top: 4px; }.copy { border: 0; background: transparent; color: var(--muted); font-size: 11px; padding: 4px 5px; }.copy:hover { color: var(--ink); }
    .composer { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px; box-shadow: 0 8px 30px rgba(47,42,33,.06); }
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    label { color: var(--muted); font-size: 11px; }
    select { min-width: 0; flex: 1; border: 0; background: transparent; color: var(--ink); font-size: 12px; font-weight: 700; outline: none; }
    .model-state { font-size: 11px; color: var(--muted); }.model-state.error { color: var(--danger); }
    .input-row { display: flex; align-items: flex-end; gap: 8px; }.input-row:focus-within { outline: 2px solid var(--accent-soft); outline-offset: 4px; border-radius: 8px; }
    textarea { width: 100%; resize: none; min-height: 44px; max-height: 140px; border: 0; outline: 0; background: transparent; color: var(--ink); padding: 10px 7px 7px; }
    textarea::placeholder { color: #9b9b95; }.send { width: 44px; height: 44px; flex: 0 0 44px; border: 0; border-radius: 13px; background: var(--accent); color: #fff; font-size: 20px; line-height: 1; transition: transform .18s ease, opacity .18s ease; }.send:hover:not(:disabled) { transform: translateY(-2px); }.send:disabled { opacity: .45; cursor: wait; }
    .hint { text-align: center; color: var(--muted); font-size: 10px; margin: 9px 0 0; }
    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 15px 16px; background: var(--surface-2); border-radius: 12px; }.typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: pulse 1s infinite alternate; }.typing i:nth-child(2) { animation-delay: .2s; }.typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { to { opacity: .25; transform: translateY(-2px); } } @keyframes appear { from { opacity: 0; transform: translateY(4px); } }
    @media (min-width: 700px) { main { padding: 34px 24px 24px; } header { padding-left: 24px; padding-right: 24px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="mark" aria-hidden="true">R</div><div><h1>Ruang Chat</h1><div id="status" class="status">Menghubungkan ke router...</div></div></div>
      <button class="clear" id="clear" type="button" aria-label="Hapus percakapan" title="Hapus percakapan">⌫</button>
    </header>
    <main>
      <section id="messages" aria-live="polite">
        <div class="welcome" id="welcome"><div class="eyebrow">Percakapan baru</div><h2>Tulis apa yang ingin kamu pikirkan.</h2><p>Pilih model di bawah, lalu mulai dari pesan pertama.</p></div>
      </section>
      <form class="composer" id="composer">
        <div class="toolbar"><label for="model">MODEL</label><select id="model" aria-label="Pilih model"><option>Memuat model...</option></select><span id="modelState" class="model-state">...</span></div>
        <div class="input-row"><textarea id="prompt" rows="1" placeholder="Ketik pesan..." aria-label="Pesan" required></textarea><button class="send" id="send" type="submit" aria-label="Kirim pesan" title="Kirim pesan">↑</button></div>
        <div class="hint">Enter untuk kirim · Shift + Enter untuk baris baru</div>
      </form>
    </main>
  </div>
  <script>
    const BASE_URL = 'https://router.juan.web.id/v1';
    const API_KEY = 'sk-pqqwcSaE6KTsrd96oih3EI7VWiuaB5tZTQ1Sup2JBV295ipJ';
    const state = { messages: [], model: '' };
    const $ = id => document.getElementById(id);

    function setStatus(text, error = false) { $('status').textContent = text; $('modelState').textContent = error ? 'gagal' : (state.model ? 'siap' : '...'); $('modelState').className = 'model-state' + (error ? ' error' : ''); }
    function markdown(text) {
      const escaped = text.replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      const blocks = []; const safe = escaped.replace(/```([\\w+-]*)\\n?([\\s\\S]*?)```/g, (_, lang, code) => { blocks.push('<pre><code>' + code.trim() + '</code></pre>'); return `@@CODE${blocks.length - 1}@@`; });
      let html = safe.replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>').replace(/\\*\\*(.+?)\\*\\*/g, '<strong>$1</strong>').replace(/\\*(.+?)\\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/^(?:[-*] .+(?:\\n|$))+?/gm, list => '<ul>' + list.trim().split(/\\n/).map(item => '<li>' + item.slice(2) + '</li>').join('') + '</ul>')
        .replace(/^(?:\\d+\\. .+(?:\\n|$))+?/gm, list => '<ol>' + list.trim().split(/\\n/).map(item => '<li>' + item.replace(/^\\d+\\. /, '') + '</li>').join('') + '</ol>')
        .split(/\\n{2,}/).map(part => /^<(?:h[1-3]|ul|ol|blockquote|pre)/.test(part) ? part : '<p>' + part.replace(/\\n/g, '<br>') + '</p>').join('');
      return html.replace(/@@CODE(\\d+)@@/g, (_, index) => blocks[index]);
    }
    function addMessage(role, content, live = false) {
      state.messages.push({ role, content }); $('welcome').hidden = true;
      const wrap = document.createElement('div'); wrap.className = 'message ' + role;
      const bubble = document.createElement('div'); bubble.className = 'bubble';
      if (role === 'assistant') bubble.innerHTML = markdown(content); else bubble.textContent = content;
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = role === 'user' ? 'Kamu' : 'Asisten';
      wrap.append(bubble, meta); if (role === 'assistant' && !live) addAssistantActions(wrap, content); $('messages').append(wrap); wrap.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return { wrap, bubble };
    }
    function addAssistantActions(wrap, content) { const actions = document.createElement('div'); actions.className = 'assistant-actions'; const copy = document.createElement('button'); copy.className = 'copy'; copy.type = 'button'; copy.textContent = 'Salin'; copy.onclick = async () => { await navigator.clipboard.writeText(content); copy.textContent = 'Tersalin'; setTimeout(() => copy.textContent = 'Salin', 1200); }; actions.append(copy); wrap.append(actions); }
    function typing(show) { const old = $('typing'); if (old) old.remove(); if (show) { const el = document.createElement('div'); el.id = 'typing'; el.className = 'message assistant'; el.innerHTML = '<div class="bubble typing"><i></i><i></i><i></i></div>'; $('messages').append(el); el.scrollIntoView({ block: 'nearest' }); } }
    async function api(path, options = {}) {
      const response = await fetch(BASE_URL + path, { ...options, headers: { Authorization: 'Bearer ' + API_KEY, 'Content-Type': 'application/json', ...(options.headers || {}) } });
      if (!response.ok) throw new Error((await response.text()).slice(0, 180) || response.statusText);
      return response.json();
    }
    async function streamChat(messages, onDelta) {
      const response = await fetch(BASE_URL + '/chat/completions', { method: 'POST', headers: { Authorization: 'Bearer ' + API_KEY, 'Content-Type': 'application/json', Accept: 'text/event-stream' }, body: JSON.stringify({ model: state.model, messages, temperature: 0.7, stream: true }) });
      if (!response.ok) throw new Error((await response.text()).slice(0, 180) || response.statusText);
      if (!response.body) throw new Error('Browser tidak mendukung response stream');
      const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = ''; let answer = '';
      const consume = event => {
        const data = event.split(/\r?\n/).filter(line => line.startsWith('data:')).map(line => line.slice(5).trim()).join('');
        if (!data || data === '[DONE]') return;
        const chunk = JSON.parse(data); const delta = chunk.choices?.[0]?.delta?.content;
        if (typeof delta === 'string') { answer += delta; onDelta(answer); }
      };
      while (true) { const { value, done } = await reader.read(); buffer += decoder.decode(value || new Uint8Array(), { stream: !done }); const events = buffer.split(/\r?\n\r?\n/); buffer = events.pop() || ''; events.forEach(consume); if (done) break; }
      if (buffer.trim()) consume(buffer); return answer;
    }
    function liveAssistant() {
      typing(false); $('welcome').hidden = true;
      const wrap = document.createElement('div'); wrap.className = 'message assistant';
      const bubble = document.createElement('div'); bubble.className = 'bubble';
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = 'Asisten';
      wrap.append(bubble, meta); $('messages').append(wrap); return { wrap, bubble };
    }
    async function loadModels() {
      try {
        const payload = await api('/models');
        const models = (payload.data || []).map(item => item.id).filter(Boolean);
        if (!models.length) throw new Error('Router tidak mengirim model');
        state.model = models[0]; $('model').replaceChildren(...models.map(id => { const option = new Option(id, id); return option; }));
        setStatus(models.length + ' model tersedia');
      } catch (error) { $('model').innerHTML = '<option value="">Model tidak tersedia</option>'; setStatus('Gagal memuat model', true); $('modelState').title = error.message; }
    }
    async function sendMessage(event) {
      event.preventDefault(); const input = $('prompt'); const content = input.value.trim();
      if (!content || !state.model || $('send').disabled) return;
      input.value = ''; input.style.height = 'auto'; addMessage('user', content); $('send').disabled = true; typing(true); setStatus('Menunggu jawaban...');
      try {
        const live = liveAssistant(); let answer = '';
        answer = await streamChat(state.messages, text => { live.bubble.innerHTML = markdown(text); live.wrap.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
        if (!answer) throw new Error('Respons router kosong'); state.messages.push({ role: 'assistant', content: answer }); addAssistantActions(live.wrap, answer); setStatus(state.messages.length / 2 + ' balasan');
      } catch (error) { typing(false); addMessage('assistant', 'Tidak bisa mendapat jawaban.\n\n' + error.message); setStatus('Permintaan gagal', true); }
      finally { typing(false); $('send').disabled = false; input.focus(); }
    }
    $('composer').addEventListener('submit', sendMessage);
    $('model').addEventListener('change', event => { state.model = event.target.value; setStatus(state.model ? 'Model siap' : 'Pilih model'); });
    $('prompt').addEventListener('input', event => { event.target.style.height = 'auto'; event.target.style.height = Math.min(event.target.scrollHeight, 140) + 'px'; });
    $('prompt').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('composer').requestSubmit(); } });
    $('clear').addEventListener('click', () => { state.messages = []; $('messages').innerHTML = ''; $('messages').append(Object.assign(document.createElement('div'), { id: 'welcome', className: 'welcome', innerHTML: '<div class="eyebrow">Percakapan baru</div><h2>Tulis apa yang ingin kamu pikirkan.</h2><p>Pilih model di bawah, lalu mulai dari pesan pertama.</p>' })); setStatus(state.model ? 'Percakapan dibersihkan' : 'Menghubungkan ke router...'); });
    loadModels();
  </script>
</body>
</html>
